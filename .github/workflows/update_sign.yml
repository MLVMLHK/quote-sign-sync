name: Update Meeting Room Sign

on:
  schedule:
    # Runs Monday through Friday, starting at 00:00 UTC (08:00 HKT) until 11:00 UTC (19:00 HKT)
    - cron: '0 0,3,6,9 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-sync]

concurrency:
  group: meeting-room-sign-daemon
  cancel-in-progress: true

jobs:
  workday-sync:
    name: Workday Sync Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run continuous sync loop
        env:
          ROBIN_TOKEN: ${{ secrets.ROBIN_TOKEN }}
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          DOT_DEVICE_ID: ${{ secrets.DOT_DEVICE_ID }}
          MAX_RUNTIME_MINS: "300"
        run: python -u update_sign.py
