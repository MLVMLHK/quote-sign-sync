name: Update Meeting Room Sign

on:
  schedule:
    # Runs every 15 minutes, Monday through Friday, from 08:00 to 19:00 HKT (00:00 to 11:00 UTC)
    - cron: '*/15 0-11 * * 1-5'
  workflow_dispatch:

jobs:
  quick-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        env:
          ROBIN_TOKEN: ${{ secrets.ROBIN_TOKEN }}
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          DOT_DEVICE_ID: ${{ secrets.DOT_DEVICE_ID }}
        run: python update_sign.py
