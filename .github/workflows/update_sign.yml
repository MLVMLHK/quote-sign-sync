name: Update Meeting Room Sign

on:
  schedule:
    # Runs at 14, 29, 44, and 59 minutes past the hour between 23:00 and 12:00 UTC, Monday through Friday only
    - cron: '14,29,44,59 23,0-12 * * 1-5'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        env:
          ROBIN_TOKEN: ${{ secrets.ROBIN_TOKEN }}
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          DOT_DEVICE_ID: ${{ secrets.DOT_DEVICE_ID }}
        run: python update_sign.py
